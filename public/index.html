<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B0C0A">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tanki">
<title>TankiTankiGeldiGeldi</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<link rel="stylesheet" crossorigin="anonymous" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- Auth -->
<section id="auth" class="auth" hidden>
  <div class="auth-hero">
    <div id="invite-banner" hidden></div>
    <div class="logo"><span>TANKI</span><span>TANKI</span><span class="ac">GELDI</span><span class="ac">GELDI</span></div>
    <p class="auth-sub">Fahrt einfach los. Die App misst, rechnet und teilt den Sprit fair unter allen auf.</p>
  </div>
  <form id="auth-form" class="auth-card" autocomplete="on">
    <div class="seg" id="auth-mode">
      <button type="button" class="on" data-act="auth-mode" data-mode="login">Anmelden</button>
      <button type="button" data-act="auth-mode" data-mode="register">Registrieren</button>
    </div>
    <label class="field"><span>Nutzername</span><input name="username" autocomplete="username" autocapitalize="off" required minlength="2" maxlength="20"></label>
    <label class="field"><span>Passwort</span><input name="password" type="password" autocomplete="current-password" required minlength="6"></label>
    <div id="auth-role" hidden>
      <span class="field-label">Wie bist du meistens unterwegs?</span>
      <div class="role-pick">
        <button type="button" class="role-opt on" data-act="auth-role" data-role="driver"><b>Ich fahre</b><small>Fahrten starten automatisch, sobald du losfährst</small></button>
        <button type="button" class="role-opt" data-act="auth-role" data-role="passenger"><b>Ich fahre mit</b><small>Du trittst den Fahrten deiner Freunde bei</small></button>
      </div>
    </div>
    <p id="auth-err" class="err" hidden></p>
    <button class="btn" id="auth-submit">Anmelden</button>
  </form>
</section>

<!-- Home: map + sheet -->
<section id="home" class="screen" hidden>
  <div id="map"></div>
  <header class="topbar">
    <button id="btn-profile" class="top-av" data-act="profile" aria-label="Profil"></button>
    <div id="gps-chip" class="chip warn">GPS startet …</div>
    <button class="round-btn" data-act="locate" aria-label="Auf mich zentrieren">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>
    </button>
  </header>
  <div id="home-sheet" class="home-sheet"><div class="grab-zone"><div class="grab"></div></div><div id="home-body"></div></div>
</section>

<section id="rides" class="screen page" hidden><h1>Fahrten</h1><div id="rides-body"></div></section>
<section id="money" class="screen page" hidden><h1>Konto</h1><div id="money-body"></div></section>
<section id="friends" class="screen page" hidden>
  <div class="page-head"><h1>Freunde</h1><button class="round-btn" data-act="all-users" aria-label="Alle Nutzer anzeigen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="friend-q" placeholder="Nutzername suchen" autocomplete="off" autocapitalize="off"></div>
  <div id="friend-results"></div>
  <div id="friends-body"></div>
</section>

<nav id="tabbar" hidden>
  <button data-act="tab" data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M9 20 3 17V4l6 3 6-3 6 3v13l-6-3-6 3z"/><path d="M9 7v13M15 4v13"/></svg>Karte</button>
  <button data-act="tab" data-tab="rides"><svg viewBox="0 0 24 24"><path d="M5 17h14M6 17l1.5-6h9L18 17"/><circle cx="8" cy="18" r="1.6"/><circle cx="16" cy="18" r="1.6"/><path d="M8.5 11 10 7h4l1.5 4"/></svg>Fahrten</button>
  <button data-act="tab" data-tab="money"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 15h2"/></svg>Konto<i class="badge" id="badge-money" hidden></i></button>
  <button data-act="tab" data-tab="friends"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.6 3.5 5.2"/></svg>Freunde<i class="badge" id="badge-friends" hidden></i></button>
</nav>

<!-- Ride detail -->
<section id="detail" class="overlay" hidden>
  <div id="detail-map"></div>
  <button class="round-btn back" data-act="detail-close" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="detail-sheet" id="detail-sheet"><div class="grab-zone"><div class="grab"></div></div><div class="detail-body" id="detail-body"></div></div>
</section>

<!-- Profile -->
<section id="profile" class="overlay page" hidden>
  <button class="round-btn back static" data-act="profile-close" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div id="profile-body"></div>
</section>

<!-- User profile & stats -->
<section id="user" class="overlay page" hidden>
  <button class="round-btn back static" data-act="user-close" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div id="user-body"></div>
</section>

<div id="sheet-bg" class="sheet-bg" hidden><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="photo-input" accept="image/*" hidden>

<script crossorigin="anonymous" src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/app.js"></script>
</body>
</html>
